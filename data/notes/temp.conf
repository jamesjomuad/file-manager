SetEnv APPLICATION_ENV "production"
ServerAdmin webmaster@realresponse.com.au
ServerName portal-v2.realresponse.com.au
DocumentRoot /var/www/portal-v2-prod.realresponse.com.au/current/public

<Directory "/var/www/portal-v2-prod.realresponse.com.au/current/public">
    Options FollowSymLinks
    AllowOverride All
    Require all granted

    # Proxy to PHP-FPM
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost/"
    </FilesMatch>
</Directory>


ErrorLog ${APACHE_LOG_DIR}/portal-v2-prod.realresponse.com.au_error.log
CustomLog ${APACHE_LOG_DIR}/portal-v2-prod.realresponse.com.au_access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf

# WebSocket support for Soketi
ProxyPreserveHost On

# Proxy /app to soketi
ProxyPass "/app""http://127.0.0.1:6001/app"
ProxyPassReverse "/app""http://127.0.0.1:6001/app"

# WebSocket Upgrade headers
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule /app/(.*) ws://127.0.0.1:6001/app/$1 [P,L]

RewriteCond %{HTTP:Upgrade} !=websocket [NC]
RewriteRule /app/(.*)           http://127.0.0.1:6001/app/$1 [P,L]

SSLCertificateFile /etc/letsencrypt/live/portal-v2.realresponse.com.au/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/portal-v2.realresponse.com.au/privkey.pem