<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookings</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid mt-5">
        <div class="d-flex flex-row bd-highlight mb-3">
            <!-- <div class="p-2">
                <div class="input-group">
                    <span class="input-group-text">Organisation</span>
                    <input id="organisationFilter" type="text" class="form-control" placeholder="Organisation">
                </div>
            </div> -->
            <div class="p-2 ml-auto">
                <div class="">
                    <a href="https://n8n.realresponse.com.au/webhook/eac7ad54-79ee-4d02-9c92-dc4247bc04b7?download=1" class="btn btn-primary" role="button">Download</a>
                </div>
            </div>
        </div>
        
        <table id="dtable" class="display table table-bordered table-striped" style="width:100%">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Address</th>
                    <th>City</th>
                    <th>State</th>
                    <th>Postcode</th>
                    <th>Course Name</th>
                    <th>Course Date</th>
                    <th>Booked Date</th>
                    <th>Organisation</th>
                </tr>
            </thead>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>


    <script>
        $(document).ready(function() {
            $table = $('#dtable').DataTable({
                searching: false, 
                paging: false, 
                info: false,
                "ajax": {
                    "url": "https://n8n.realresponse.com.au/webhook/eac7ad54-79ee-4d02-9c92-dc4247bc04b7",
                    "dataSrc": ""
                },
                "columns": [
                    { "data": "id" },
                    { "data": "first_name" },
                    { "data": "last_name" },
                    { "data": "email" },
                    { "data": "delivery.address" },
                    { "data": "delivery.city" },
                    { "data": "delivery.state" },
                    { "data": "delivery.postcode" },
                    { "data": "course_name" },
                    { "data": "course_date" },
                    { "data": "booking_date" },
                    { "data": "organisation" }
                ]
            });

            // Custom filter for Organisation field
            $('#organisationFilter').on('change', function() {
                var selectedValue = $(this).val();
                table.column(3).search(selectedValue).draw();
            });
        });
    </script>
</body>
</html>
